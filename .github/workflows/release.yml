name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: Publish to npm
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Release preflight
        run: npm run release:check

      - name: Publish @risklab/charts
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish chart adapter packages
        run: |
          for workspace in charts/react charts/vanilla charts/vue charts/svelte charts/angular charts/lit charts/solid; do
            npm publish --workspace="$workspace" --access public --provenance
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create release artifacts
        run: |
          mkdir -p artifacts/release
          npm pack --pack-destination artifacts/release
          npm pack --workspaces --pack-destination artifacts/release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/release/*.tgz
